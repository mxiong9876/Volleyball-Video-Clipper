[project]
name = "volley-api"
version = "0.0.0"
description = "FastAPI backend for Volley Breakdown"
requires-python = "==3.11.*"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "redis",
]

[dependency-groups]
dev = ["pytest", "ruff", "httpx"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
