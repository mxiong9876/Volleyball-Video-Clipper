[project]
name = "volley-pipeline"
version = "0.0.0"
description = "Pure-Python analysis pipeline for Volley Breakdown"
requires-python = "==3.11.*"
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["volley_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
