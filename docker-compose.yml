services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: volley
      POSTGRES_PASSWORD: volley
      POSTGRES_DB: volley
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volley -d volley"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
